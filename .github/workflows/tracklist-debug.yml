name: Temporary GlobalDJMix Tracklist Diagnostic
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tracklist-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Login and inspect tracklist JavaScript
        env:
          SITE_LOGIN: ${{ secrets.GLOBALDJMIX_USERNAME }}
          SITE_PASSWORD: ${{ secrets.GLOBALDJMIX_PASSWORD }}
        run: |
          python - <<'PY'
          import os, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          base = "https://globaldjmix.com"
          episode = base + "/david-guetta-playlist-849-2026-october-02/"
          s = requests.Session()
          s.headers["User-Agent"] = "Mozilla/5.0"
          try:
              r = s.get(base + "/get-auth-form", timeout=20)
              soup = BeautifulSoup(r.text, "html.parser")
              f = soup.find("form")
              data = {}
              if f:
                  for el in f.find_all("input"):
                      name = el.get("name")
                      if not name: continue
                      typ = (el.get("type") or "text").lower()
                      if typ == "password": data[name] = os.getenv("SITE_PASSWORD", "")
                      elif name.lower() in ("login", "username", "user", "email"): data[name] = os.getenv("SITE_LOGIN", "")
                      else: data[name] = el.get("value", "")
                  login = s.post(urljoin(r.url, f.get("action") or r.url), data=data, timeout=20, allow_redirects=True)
                  print("LOGIN_OK", login.status_code, login.url, any(x in login.text.lower() for x in ("logout", "log out", "sign out")))
              er = s.get(episode, timeout=20)
              es = BeautifulSoup(er.text, "html.parser")
              btn = es.select_one("button.show-tracklist")
              print("BUTTON", btn.get("data-id") if btn else None, "page", er.status_code)
              if btn:
                  tr = s.get(base + "/get-tracklist", params={"id": btn.get("data-id")}, headers={"Referer": episode, "X-Requested-With": "XMLHttpRequest"}, timeout=20)
                  print("TRACKLIST_RESPONSE", tr.status_code, "content_type=", tr.headers.get("Content-Type"), "bytes=", len(tr.text), "preview=", tr.text[:900].replace("\\n", " "))
                  try:
                      payload = tr.json()
                      raw = payload.get("tracklist", "")
                      plain = BeautifulSoup(raw, "html.parser").get_text(" ", strip=True)
                      print("TRACKLIST_JSON", "success=", payload.get("success"), "raw_length=", len(raw), "plain_length=", len(plain), "plain_preview=", plain[:700])
                  except Exception as exc:
                      print("TRACKLIST_JSON_PARSE_ERROR", type(exc).__name__)
              for script in es.find_all("script"):
                  txt = script.string or script.get_text()
                  if txt:
                      for pat in (r"show-tracklist", r"tracklist", r"tracklist-single-item"):
                          for m in list(re.finditer(pat, txt, re.I))[:8]:
                              print("INLINE_MATCH", pat, re.sub(r"\\s+", " ", txt[max(0,m.start()-250):m.end()+450])[:750])
              for path in ["/dist/js/script.js?v=6.2", "/dist/js/ajax.js?v=1.1", "/dist/js/style.js?v=1.0"]:
                  jsurl = base + path
                  try:
                      js = s.get(jsurl, timeout=15).text
                  except Exception as exc:
                      print("JS_ERROR", jsurl, type(exc).__name__); continue
                  print("SCRIPT_URL", jsurl, "bytes", len(js))
                  for pat in (r"show-tracklist", r"tracklist-single-item", r"tracklist", r"get-tracklist", r"track-list"):
                      found = list(re.finditer(pat, js, re.I))
                      if found:
                          print("PATTERN", pat, "count", len(found))
                          for m in found[:10]:
                              print("JS_CONTEXT", re.sub(r"\\s+", " ", js[max(0,m.start()-300):m.end()+550])[:850])
              print("DONE")
          except Exception as exc:
              print("DIAG_ERROR", type(exc).__name__, str(exc)[:250])
          PY
