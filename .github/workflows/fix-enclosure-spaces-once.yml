name: One-time RSS enclosure URL space fix
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-enclosure-spaces-once.yml"

permissions:
  contents: write

concurrency:
  group: one-time-enclosure-url-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Encode literal spaces in enclosure URL attributes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path = Path("rss.xml")
          original = path.read_text(encoding="utf-8")
          pattern = re.compile(r"""(<enclosure\b[^>]*?\burl=(["']))(.*?)(\2[^>]*>)""", re.I | re.S)
          old_matches = list(pattern.finditer(original))
          old_urls = [m.group(3) for m in old_matches]
          changed_urls = 0
          encoded_spaces = 0

          def replace(match):
              global changed_urls, encoded_spaces
              url = match.group(3)
              n = url.count(" ")
              if not n:
                  return match.group(0)
              changed_urls += 1
              encoded_spaces += n
              return match.group(1) + url.replace(" ", "%20") + match.group(4)

          updated = pattern.sub(replace, original)
          new_matches = list(pattern.finditer(updated))
          new_urls = [m.group(3) for m in new_matches]
          normalize = lambda s: pattern.sub(lambda m: m.group(1) + "__URL__" + m.group(4), s)

          if len(old_urls) != 7126:
              raise SystemExit(f"Expected 7126 enclosure URLs, found {len(old_urls)}")
          if changed_urls != 4030:
              raise SystemExit(f"Expected to update 4030 URLs, updated {changed_urls}")
          if new_urls != [u.replace(" ", "%20") for u in old_urls]:
              raise SystemExit("URL-only transformation check failed")
          if any(" " in url for url in new_urls):
              raise SystemExit("Literal spaces remain in enclosure URLs")
          if normalize(original) != normalize(updated):
              raise SystemExit("Non-URL XML content changed")
          ET.fromstring(updated)
          path.write_text(updated, encoding="utf-8")
          print(f"Enclosure URLs: {len(new_urls)}; URLs changed: {changed_urls}; spaces encoded: {encoded_spaces}; remaining URL spaces: 0")
          PY
          rm .github/workflows/fix-enclosure-spaces-once.yml
          git add rss.xml .github/workflows/fix-enclosure-spaces-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Encode spaces in RSS enclosure URLs"
          git push origin HEAD:main
