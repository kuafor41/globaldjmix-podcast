name: Update GlobalDJMix Podcast RSS
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-feed.yml"
      - "fetch_feed.py"
      - "requirements.txt"
      - "README.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "Test 50 newest episodes, update recent entries, import episodes from 2025 onward, or backfill the full archive"
        required: true
        type: choice
        default: incremental
        options:
          - test
          - incremental
          - since2025
          - full
  schedule:
    # Request one run every hour at minute 30, using Istanbul local time.
    # GitHub may still delay scheduled starts during periods of scheduler load.
    - cron: "30 * * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: globaldjmix-podcast-rss
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FEED_MODE: ${{ github.event_name == 'schedule' && 'incremental' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[backfill-full]') && 'full' || contains(github.event.head_commit.message, '[backfill-2025]') && 'since2025')) || inputs.mode || 'incremental' }}
      HOURLY_REPORT_ENABLED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile fetch_feed.py
      - name: Build and validate podcast feed
        run: python fetch_feed.py
      - name: Commit feed data and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml data/items.json data/test-report.json data/retry-queue.json data/daily-additions.json data/hourly-success-report.csv
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update GlobalDJMix podcast feed"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
