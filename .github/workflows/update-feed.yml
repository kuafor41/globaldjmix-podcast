name: Update GlobalDJMix Podcast RSS
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"
      timezone: "Europe/Istanbul"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: globaldjmix-rss
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    env:
      FEED_MODE: \${{ github.event_name == 'schedule' && 'incremental' || 'test' }}
      REQUEST_TIMEOUT: \${{ github.event_name == 'schedule' && '60' || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Build test/incremental podcast feed
        run: python fetch_feed.py
      - name: Commit generated feed and test report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml data/items.json data/test-report.json
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Update GlobalDJMix podcast test feed"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
